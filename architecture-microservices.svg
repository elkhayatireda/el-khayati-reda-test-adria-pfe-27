<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">Banking microservices architecture</title>
  <desc id="description">Architecture showing clients accessing services through Spring Cloud Gateway, service registration with Eureka, centralized configuration, and Transaction Service calling Account Service through OpenFeign and Resilience4J.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#edf3fb"/>
    </linearGradient>
    <linearGradient id="gateway" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="infra" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="account" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfdf5"/>
      <stop offset="1" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="transaction" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#ffedd5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#17345c" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1L11 6L1 11Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1L11 6L1 11Z" fill="#059669"/>
    </marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1L11 6L1 11Z" fill="#7c3aed"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .title { font-size: 34px; font-weight: 750; fill: #10233f; }
      .subtitle { font-size: 16px; fill: #5b6b82; }
      .node-title { font-size: 19px; font-weight: 700; fill: #10233f; }
      .node-sub { font-size: 14px; fill: #475569; }
      .small { font-size: 12px; fill: #64748b; }
      .edge-label { font-size: 12px; font-weight: 650; fill: #334155; }
      .white { fill: #ffffff; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="url(#background)"/>
  <circle cx="1300" cy="90" r="180" fill="#dbeafe" opacity="0.35"/>
  <circle cx="100" cy="820" r="230" fill="#e0e7ff" opacity="0.32"/>

  <text x="720" y="62" text-anchor="middle" class="title">Banking Microservices Architecture</text>
  <text x="720" y="91" text-anchor="middle" class="subtitle">Spring Cloud · REST · OpenFeign · Resilience4J · H2</text>

  <!-- Client -->
  <g filter="url(#shadow)">
    <rect x="565" y="120" width="310" height="76" rx="18" fill="#ffffff" stroke="#d7e1ef"/>
  </g>
  <circle cx="602" cy="158" r="18" fill="#dbeafe"/>
  <path d="M594 157h16M602 149v16M590 170c3-7 21-7 24 0" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
  <text x="635" y="153" class="node-title">Client / Browser</text>
  <text x="635" y="175" class="node-sub">REST API requests</text>

  <!-- Gateway -->
  <g filter="url(#shadow)">
    <rect x="500" y="250" width="440" height="112" rx="20" fill="url(#gateway)"/>
  </g>
  <circle cx="548" cy="306" r="22" fill="#ffffff" opacity="0.18"/>
  <path d="M538 306h20M551 299l7 7-7 7M545 299l-7 7 7 7" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="590" y="299" class="node-title white">Spring Cloud Gateway</text>
  <text x="590" y="324" class="node-sub white">Port 8080 · Dynamic service routing</text>
  <text x="590" y="344" class="small white">Routes requests to registered services</text>

  <!-- Client to Gateway -->
  <path d="M720 196V240" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="738" y="225" class="edge-label">HTTP</text>

  <!-- Config Server -->
  <g filter="url(#shadow)">
    <rect x="72" y="398" width="320" height="160" rx="20" fill="url(#infra)" stroke="#c7d2fe"/>
  </g>
  <circle cx="112" cy="440" r="20" fill="#c7d2fe"/>
  <path d="M104 434h16M104 440h16M104 446h10" stroke="#4f46e5" stroke-width="2.4" stroke-linecap="round"/>
  <text x="145" y="438" class="node-title">Config Server</text>
  <text x="145" y="460" class="node-sub">Port 8888 · Native profile</text>
  <rect x="96" y="484" width="272" height="48" rx="10" fill="#ffffff" opacity="0.9"/>
  <text x="112" y="504" class="small">Shared configuration</text>
  <text x="112" y="522" font-size="14" font-weight="700" fill="#4338ca">bank.transaction.max-amount = 1000</text>

  <!-- Eureka -->
  <g filter="url(#shadow)">
    <rect x="560" y="410" width="320" height="138" rx="20" fill="url(#infra)" stroke="#c7d2fe"/>
  </g>
  <circle cx="604" cy="454" r="20" fill="#c7d2fe"/>
  <circle cx="598" cy="454" r="4" fill="#4f46e5"/>
  <circle cx="610" cy="446" r="4" fill="#4f46e5"/>
  <circle cx="610" cy="462" r="4" fill="#4f46e5"/>
  <path d="M601 452l6-4M601 456l6 4" stroke="#4f46e5" stroke-width="2"/>
  <text x="638" y="451" class="node-title">Eureka Discovery</text>
  <text x="638" y="474" class="node-sub">Port 8761 · Service registry</text>
  <text x="590" y="516" class="small">Registration and discovery for app services</text>

  <!-- Account service -->
  <g filter="url(#shadow)">
    <rect x="1000" y="398" width="360" height="196" rx="20" fill="url(#account)" stroke="#a7f3d0"/>
  </g>
  <circle cx="1044" cy="442" r="20" fill="#a7f3d0"/>
  <path d="M1034 443h20M1037 438h14M1038 447h12M1044 433v19" stroke="#047857" stroke-width="2" stroke-linecap="round"/>
  <text x="1078" y="438" class="node-title">Account-Service</text>
  <text x="1078" y="461" class="node-sub">Port 8081 · Account and balance API</text>
  <rect x="1024" y="490" width="312" height="76" rx="12" fill="#ffffff" opacity="0.85"/>
  <ellipse cx="1061" cy="509" rx="20" ry="7" fill="#34d399"/>
  <path d="M1041 509v28c0 4 9 8 20 8s20-4 20-8v-28M1041 523c0 4 9 8 20 8s20-4 20-8" fill="none" stroke="#059669" stroke-width="2"/>
  <text x="1094" y="516" class="node-sub">H2 database</text>
  <text x="1094" y="539" font-size="13" font-weight="650" fill="#047857">Manages account balances</text>

  <!-- Transaction service -->
  <g filter="url(#shadow)">
    <rect x="430" y="666" width="580" height="178" rx="22" fill="url(#transaction)" stroke="#fed7aa"/>
  </g>
  <circle cx="480" cy="710" r="21" fill="#fed7aa"/>
  <path d="M469 705h18l-5-5M491 715h-18l5 5" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="518" y="708" class="node-title">Transaction-Service</text>
  <text x="518" y="733" class="node-sub">Port 8082 · Transactions and transfers</text>
  <rect x="458" y="761" width="245" height="58" rx="12" fill="#ffffff" opacity="0.9"/>
  <ellipse cx="490" cy="778" rx="17" ry="6" fill="#fb923c"/>
  <path d="M473 778v21c0 4 8 7 17 7s17-3 17-7v-21M473 789c0 4 8 7 17 7s17-3 17-7" fill="none" stroke="#ea580c" stroke-width="1.8"/>
  <text x="518" y="785" class="node-sub">H2 database</text>
  <text x="518" y="805" class="small">Stores transaction records</text>
  <rect x="722" y="761" width="260" height="58" rx="12" fill="#ffffff" opacity="0.9"/>
  <text x="742" y="784" class="node-sub">OpenFeign + Resilience4J</text>
  <text x="742" y="805" class="small">Account lookup · balance update</text>

  <!-- Gateway to service layer -->
  <path d="M620 362V382H1180V388" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="910" y="377" class="edge-label">Dynamic route via Eureka</text>
  <path d="M720 362V650" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="738" y="624" class="edge-label">Dynamic route via Eureka</text>

  <!-- Config connections -->
  <path d="M392 460H452V627H565V657" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-purple)"/>
  <text x="407" y="446" class="edge-label">Config Client</text>
  <path d="M392 490H960V387H1110" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-purple)"/>
  <text x="858" y="479" class="edge-label">Config Client</text>

  <!-- Eureka registrations -->
  <path d="M645 410V382H476V358" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow-green)"/>
  <path d="M810 548V620H880V657" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow-green)"/>
  <path d="M880 450H965V466H990" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow-green)"/>
  <text x="834" y="608" class="edge-label">Register / discover</text>
  <text x="891" y="436" class="edge-label">Register / discover</text>

  <!-- Feign call -->
  <path d="M1010 790H1132V625H1180V604" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <rect x="1045" y="706" width="306" height="54" rx="12" fill="#fff" stroke="#fed7aa" filter="url(#shadow)"/>
  <text x="1198" y="729" text-anchor="middle" class="edge-label">OpenFeign REST call</text>
  <text x="1198" y="748" text-anchor="middle" class="small">Circuit breaker: Resilience4J</text>

  <!-- Legend -->
  <g transform="translate(82 628)">
    <rect width="270" height="150" rx="16" fill="#ffffff" opacity="0.78" stroke="#dbe4ef"/>
    <text x="20" y="29" font-size="13" font-weight="700" fill="#334155">LEGEND</text>
    <path d="M22 54h38" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <text x="74" y="59" class="small">HTTP / service call</text>
    <path d="M22 84h38" stroke="#059669" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-green)"/>
    <text x="74" y="89" class="small">Eureka registration</text>
    <path d="M22 114h38" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-purple)"/>
    <text x="74" y="119" class="small">Central configuration</text>
  </g>
</svg>
