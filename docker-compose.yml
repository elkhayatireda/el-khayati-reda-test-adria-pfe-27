version: '3.8'

services:
  discovery-service:
    build:
      context: ./discovery-service
    container_name: discovery-service
    ports:
      - "8761:8761"
    environment:
      - EUREKA_HOSTNAME=discovery-service
      - EUREKA_SERVER_URL=http://discovery-service:8761/eureka/
    networks:
      - adria-network

  config-service:
    build:
      context: ./config-service
    container_name: config-service
    ports:
      - "8888:8888"
    environment:
      - EUREKA_SERVER_URL=http://discovery-service:8761/eureka/
    depends_on:
      - discovery-service
    networks:
      - adria-network

  account-service:
    build:
      context: ./account-service
    container_name: account-service
    ports:
      - "8081:8081"
    environment:
      - EUREKA_SERVER_URL=http://discovery-service:8761/eureka/
      - CONFIG_SERVER_URL=http://config-service:8888
    depends_on:
      - discovery-service
      - config-service
    networks:
      - adria-network

  transaction-service:
    build:
      context: ./transaction-service
    container_name: transaction-service
    ports:
      - "8082:8082"
    environment:
      - EUREKA_SERVER_URL=http://discovery-service:8761/eureka/
      - CONFIG_SERVER_URL=http://config-service:8888
    depends_on:
      - discovery-service
      - config-service
      - account-service
    networks:
      - adria-network

  gateway-service:
    build:
      context: ./gateway-service
    container_name: gateway-service
    ports:
      - "8085:8080"
    environment:
      - EUREKA_SERVER_URL=http://discovery-service:8761/eureka/
    depends_on:
      - discovery-service
    networks:
      - adria-network

  ebank-bot:
    build:
      context: ./ebank-bot
    container_name: ebank-bot
    ports:
      - "8058:8058"
    environment:
      - EUREKA_SERVER_URL=http://discovery-service:8761/eureka/
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - ACCOUNT_MCP_URL=http://account-service:8081/mcp
      - TRANSACTION_MCP_URL=http://transaction-service:8082/mcp
    depends_on:
      - discovery-service
      - account-service
      - transaction-service
    networks:
      - adria-network

networks:
  adria-network:
    driver: bridge
